[package]
name = "provider-tests"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "main"
path = "src/bin/main.rs"
test = false

[dependencies]
jsonwebtoken = { workspace = true, features = [
  "use_pem",
  "aws_lc_rs",
  "rust_crypto",
] }
jsonwebtoken-botan = { path = "../jsonwebtoken-botan" }
jsonwebtoken-openssl = { path = "../jsonwebtoken-openssl" }
botan = { workspace = true }
openssl = { workspace = true }
serde = "1.0.228"
strum = { version = "0.28.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
