name: nightly

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} @ ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  upstream-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version-source: [cargo, master]
        package: [botan, openssl]
        include:
          - package: botan
            crate: jsonwebtoken-botan
          - package: openssl
            crate: jsonwebtoken-openssl
    steps:
      - uses: actions/checkout@v5
        with:
          path: providers
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mv providers/flake.nix ./
          mv providers/flake.lock ./
      - name: Find jsonwebtoken version
        if: matrix.version-source == 'cargo'
        run: echo "rev=$(python3 providers/ci/find_version.py)" >> $GITHUB_OUTPUT
        shell: "nix develop -c bash -e {0}"
        id: version
      - uses: actions/checkout@v5
        with:
          repository: Keats/jsonwebtoken
          path: upstream
          ref: ${{ matrix.version-source == 'master' && 'master' || format('v{0}', steps.version.outputs.rev) }}
      - run: python3 providers/ci/patch_upstream.py --package ${{ matrix.package }} --crate ${{ matrix.crate }}
        shell: "nix develop -c bash -e {0}"
      - name: Run upstream tests
        run: cd upstream && ctest --no-fail-fast
        shell: "nix develop -c bash -e {0}"
